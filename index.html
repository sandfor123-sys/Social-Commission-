<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Social Commission - Unir & Accompagner</title>
    
    <!-- PWA Meta tags and Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Social Comm" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service Worker enregistré avec succès, scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('Échec de l\'enregistrement du Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
